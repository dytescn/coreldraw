[package]
name = "coreldraw"
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
publish = false
description = "cyctron libary plugin (cdylib) exposing cdrsdk interfaces as C ABI symbols"

[lib]
name = "coreldraw"
crate-type = ["cdylib"]

[dependencies]
cdrsdk = { path = ".." }
serde_json = "1.0"
windows = { version = "0.62.0", features = [
    "Win32_Foundation",
    "Win32_System_Com",
] }
