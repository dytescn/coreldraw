[package]
name = "cdrsdk"
version = "0.1.0"
edition = "2024"
authors = ["dowell <dowell@funxdata.com>"]
description = "Coreldraw rust sdk"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/funxdata/cdrsdk.git"
keywords = ["cdrsdk", "coreldraw"] # 推荐
categories = ["graphics"] 

[dependencies]
wincom = "0.1.0"
dyteslogs = "0.1.0"
windows = { version = "0.52.0", features = [
        "Win32_System_Com",
        "Data_Xml_Dom",
        "Win32_Foundation",
        "Win32_Security",
        "Win32_System_Threading",
        "Win32_System_Ole",
        "Win32_System_Variant",
]}
