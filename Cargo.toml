[package]
name = "cdrsdk"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
authors = ["dowell <dowell@funxdata.com>"]
description = "Rust SDK for CorelDRAW automation via COM IDispatch late binding"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/funxdata/cdrsdk"
homepage = "https://github.com/funxdata/cdrsdk"
documentation = "https://docs.rs/cdrsdk"
keywords = ["coreldraw", "com", "automation", "idispatch", "graphics"]
categories = ["api-bindings", "graphics", "windows"]

# tests/ 保留作为使用示例
exclude = [
    ".github/",
    "docs/",
    "info.md",
    "*.bat",
    "*.txt",
]

[dependencies]
wincom = "0.2.0"
dyteslogs = "0.1.0"
windows = { version = "0.62.0", features = [
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_Foundation",
] }

[package.metadata.docs.rs]
targets = ["x86_64-pc-windows-msvc"]
default-target = "x86_64-pc-windows-msvc"